name: Bug report
description: Stride does something wrong, or does not work with your walking pad.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The Diagnostics log is the most useful thing you can add.
        This is a public page: the log hides the pad's own id, your weight and the pad's Bluetooth address, but read it
        before you post and cut anything you do not want to share.
  - type: input
    id: pad
    attributes:
      label: Walking pad model
      description: The model on the label or in the manual (for example HY-BA06B1), and the brand (PitPat, Superun, DeerRun, other).
      placeholder: "PitPat HY-BA06B1"
    validations:
      required: true
  - type: input
    id: pad-name
    attributes:
      label: Bluetooth name of the pad
      description: The name shown in Stride's Find list or in Android's Bluetooth settings (for example PitPat-T01 or BA06-xxxx). Write "not listed" if Stride never shows your pad.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: What you tapped, what the screen said, and what the belt did.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how.
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: |
        In Stride: Settings, Diagnostics log, Share, then paste it here. Do this soon after the problem, before you close
        the app, so the log still has it.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stride version
      description: Settings, About Stride, the line that says Version.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Google Pixel 8 Pro, Android 16"
    validations:
      required: true
