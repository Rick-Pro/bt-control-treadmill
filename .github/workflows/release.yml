name: Release

# A merge to main that changes VERSION publishes that version as a real numbered release, by itself (decision D30).
# There are no test builds and no pre-releases. A manual run is the fallback: Actions, Release, Run workflow (from
# main), enter the version, for example v1.0.1.
# 0. "Decide what to release" reads VERSION. On a push, if the tag v<VERSION> already exists it prints the notice
#    "VERSION unchanged, nothing to release" and stops without building. If the tag is missing, the release runs
#    for v<VERSION>. A release that fails leaves no tag, so the next push to main tries again. A manual run always
#    goes on to the preflight, which refuses a tag that does not match VERSION.
# 1. scripts/release-preflight.sh checks the tag, VERSION, that the release and tag are new, and that the release
#    key settings exist, before anything is built. It lists every problem at once.
# 2. Core and app unit tests, then the release (R8) APK and the release App Bundle, stamped with that version.
# 3. scripts/release-sign.sh aligns the APK, signs it with the release key and checks the signature, the certificate
#    against STRIDE_CERT_SHA256, the package, the version and the 8 MB budget. scripts/release-sign-aab.sh signs the
#    bundle with the same key using jarsigner and checks the signature, the certificate, the package and the version.
#    Then the permission allow-list on the APK.
# 4. Publishes stride-vX.Y.Z.apk, stride-vX.Y.Z.aab and a .sha256 for each as the GitHub Release vX.Y.Z.
#    The .apk is what people install. The .aab is what goes into the Google Play Console (docs/play-store.md).
# Settings (names only): secrets STRIDE_KEYSTORE_BASE64 and STRIDE_KEYSTORE_PASSWORD, variables STRIDE_KEY_ALIAS
# and STRIDE_CERT_SHA256. scripts/make-release-key.sh sets all four. Only this workflow reads them.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v0.1.0. It must match the VERSION file.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide what to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read VERSION and look for its tag
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: the tag is what was typed. The preflight checks it against VERSION.
            echo "tag=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Manual run for ${INPUT_VERSION} (VERSION is ${version})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Only a 404 means "no such tag". Any other API failure stops the run: never guess.
          if out="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" 2>&1)"; then
            exists=true
          elif grep -q 'HTTP 404' <<< "$out"; then
            exists=false
          else
            echo "::error title=Could not check for the tag ${tag}::${out}"
            exit 1
          fi
          if [ "$exists" = true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::VERSION unchanged, nothing to release (${tag} already exists)."
            echo "VERSION unchanged, nothing to release (${tag} already exists)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "VERSION is ${version} and ${tag} does not exist yet: releasing it." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build, sign and publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag, VERSION and the release key settings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STRIDE_KEYSTORE_BASE64: ${{ secrets.STRIDE_KEYSTORE_BASE64 }}
          STRIDE_KEYSTORE_PASSWORD: ${{ secrets.STRIDE_KEYSTORE_PASSWORD }}
          STRIDE_KEY_ALIAS: ${{ vars.STRIDE_KEY_ALIAS }}
          STRIDE_CERT_SHA256: ${{ vars.STRIDE_CERT_SHA256 }}
        run: scripts/release-preflight.sh "$TAG"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Tests, the release APK and the release App Bundle
        run: scripts/ci-gradle.sh "-Pstride.versionName=${TAG#v}" :core:test :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Align, sign and check the APK and the App Bundle
        env:
          STRIDE_KEYSTORE_BASE64: ${{ secrets.STRIDE_KEYSTORE_BASE64 }}
          STRIDE_KEYSTORE_PASSWORD: ${{ secrets.STRIDE_KEYSTORE_PASSWORD }}
          STRIDE_KEY_ALIAS: ${{ vars.STRIDE_KEY_ALIAS }}
          STRIDE_CERT_SHA256: ${{ vars.STRIDE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          export STRIDE_KEYSTORE="$RUNNER_TEMP/stride-release.p12" STRIDE_VERSION="${TAG#v}"
          printf '%s' "$STRIDE_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$STRIDE_KEYSTORE" \
            || { echo "::error title=Bad STRIDE_KEYSTORE_BASE64::It is not valid base64. Run scripts/make-release-key.sh again: it reuses the key and sets it."; exit 1; }
          shopt -s nullglob
          built=(app/build/outputs/apk/release/*.apk)
          [ "${#built[@]}" -eq 1 ] || { echo "::error::Expected one release APK, found ${#built[@]}."; exit 1; }
          scripts/release-sign.sh "${built[0]}" "dist/stride-${TAG}.apk"
          bundles=(app/build/outputs/bundle/release/*.aab)
          [ "${#bundles[@]}" -eq 1 ] || { echo "::error::Expected one release bundle, found ${#bundles[@]}."; exit 1; }
          scripts/release-sign-aab.sh "${bundles[0]}" "dist/stride-${TAG}.aab"
          rm -f "$STRIDE_KEYSTORE"

      - name: Permission allow-list (config/allowed-permissions.txt)
        run: scripts/ci-check-permissions.sh "dist/stride-${TAG}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT: ${{ vars.STRIDE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="stride-${TAG}.apk"
          aab="stride-${TAG}.aab"
          sha="$(cut -d' ' -f1 "dist/${apk}.sha256")"
          aab_sha="$(cut -d' ' -f1 "dist/${aab}.sha256")"
          cert="$(tr -d ': ' <<< "$CERT" | tr 'A-F' 'a-f')"
          notes="Stride ${TAG}, for Android 13 or newer.

          - What changed: the ${TAG} row of What's new in the README, https://github.com/${GH_REPO}#whats-new
          - How to install or update: https://github.com/${GH_REPO}#install
          - SHA-256 of ${apk}: ${sha} (${apk}.sha256 holds the same, for sha256sum -c)
          - ${aab} is the Android App Bundle for the Google Play Console. It is not installable on a phone. SHA-256: ${aab_sha}
          - Certificate SHA-256: ${cert}. Every release carries this same certificate, which is why an update installs over the old copy."
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Stride ${TAG}" --notes "$notes" \
            "dist/${apk}" "dist/${apk}.sha256" "dist/${aab}" "dist/${aab}.sha256"
          echo "Published ${TAG}: https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the decoded release key
        if: always()
        run: rm -f "$RUNNER_TEMP/stride-release.p12"
