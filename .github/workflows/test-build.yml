name: Latest test build

# Every push to main (and a manual run) replaces the rolling "test-latest" prerelease with a fresh debug APK.
# It is signed with the committed debug key (decision D6), so each test build installs over the last one,
# and it installs as "Stride Dev" next to a release build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: test-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-build:
    name: Build and publish the test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build the debug APK
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          scripts/ci-gradle.sh "-Pstride.versionName=${version}-test.${GITHUB_RUN_NUMBER}" \
            "-Pstride.versionCode=${GITHUB_RUN_NUMBER}" :app:assembleDebug
          # The version is in the file name, so a downloaded copy says which build it is.
          apk="stride-test-${version}-test.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "Version ${version}-test.${GITHUB_RUN_NUMBER}, code ${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          cat "$apk.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Permission allow-list
        run: scripts/ci-check-permissions.sh "$APK"
      - name: Signed with the committed debug key
        run: scripts/ci-check-debug-signer.sh "$APK"
      - name: Replace the Latest test build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          notes="Test build ${version}-test.${GITHUB_RUN_NUMBER} for Ricardo's devices, built from ${GITHUB_SHA::7}. This is a test build, not a release.

          - It installs as Stride Dev, next to a release build of Stride.
          - Each new test build installs over the last one and keeps its settings and history.
          - To install: download ${APK} on the phone, tap it, and allow your browser to install apps if Android asks.
          - ${APK}.sha256 holds the file's SHA-256 so you can check the download (sha256sum -c)."
          gh release delete test-latest --cleanup-tag -y || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/test-latest" 2>/dev/null || true # a tag left without its release
          gh release create test-latest --prerelease --target "$GITHUB_SHA" --title "Latest test build" \
            --notes "$notes" "$APK" "$APK.sha256"
